[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medusa-heads-from-scratch"
version = "0.1.0"
description = "Medusa heads from scratch: tree-attention verification with a compacting KV cache on Qwen2.5-0.5B, exact greedy equivalence, optimal candidate trees and a wall-clock benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "transformers>=4.56"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
train = ["datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
